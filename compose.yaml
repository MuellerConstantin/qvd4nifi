# Local NiFi for testing the qvd4nifi NAR. Build the NAR first: python scripts/build_nar.py
name: qvd4nifi

services:
  nifi:
    image: apache/nifi:2.12.0
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_PROXY_HOST: "localhost:8443,nifi:8443"
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: 05ae4474483ded5292f3015f5cb4fe3f
    volumes:
      # Custom NARs are picked up from the autoload directory.
      - ./dist:/opt/nifi/nifi-current/nar_extensions:ro
      # Sample QVD files, read-only input for ListFile/FetchFile.
      - ./data:/data:ro
      # Output directory for PutFile, git-ignored.
      - ./scratchpad:/scratchpad
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-database:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository

  # Imports every file in flows/ as process group once NiFi is up, skipping existing ones.
  seed:
    image: python:3.12-slim
    depends_on:
      - nifi
    restart: "no"
    command: ["python", "/seed/seed_flows.py"]
    environment:
      NIFI_USERNAME: admin
      NIFI_PASSWORD: 05ae4474483ded5292f3015f5cb4fe3f
    volumes:
      - ./scripts/seed_flows.py:/seed/seed_flows.py:ro
      - ./flows:/flows:ro

volumes:
  nifi-conf:
  nifi-state:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
